<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>The Land of Ooo — Adventure RPG</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #73c8f8;
      font-family: 'Fredoka', 'Nunito', 'Segoe UI', system-ui, sans-serif;
    }
    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Adventure Time Stylized UI */
    #ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    /* Top HUD */
    .top-hud {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: auto;
    }
    .hud-card {
      background: rgba(255, 255, 255, 0.92);
      border: 3.5px solid #2d2b42;
      border-radius: 18px;
      padding: 10px 18px;
      box-shadow: 0 6px 0 #2d2b42;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hero-avatar {
      width: 44px;
      height: 44px;
      background: #68bbf8;
      border: 3px solid #2d2b42;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .hero-info h2 {
      font-size: 15px;
      font-weight: 900;
      color: #2d2b42;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .hp-bar {
      width: 120px;
      height: 10px;
      background: #e2e8f0;
      border: 2px solid #2d2b42;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 4px;
    }
    .hp-fill {
      width: 100%;
      height: 100%;
      background: #ff477e;
      transition: width 0.3s ease;
    }

    .quest-card {
      background: #fdf6b2;
      border: 3.5px solid #2d2b42;
      border-radius: 18px;
      padding: 10px 18px;
      box-shadow: 0 6px 0 #2d2b42;
      text-align: right;
    }
    .quest-card h3 {
      font-size: 12px;
      font-weight: 900;
      color: #723b13;
      text-transform: uppercase;
    }
    .quest-tracker {
      font-size: 14px;
      font-weight: 800;
      color: #2d2b42;
      margin-top: 2px;
    }

    /* Dialogue Box */
    #dialogue-box {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: min(650px, 92vw);
      background: #fffbe6;
      border: 4px solid #2d2b42;
      border-radius: 22px;
      box-shadow: 0 8px 0 #2d2b42;
      padding: 18px 24px;
      display: none;
      pointer-events: auto;
      z-index: 100;
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      from { transform: translateX(-50%) scale(0.85); opacity: 0; }
      to { transform: translateX(-50%) scale(1); opacity: 1; }
    }
    .speaker-name {
      display: inline-block;
      background: #ff5e7e;
      color: #ffffff;
      border: 2.5px solid #2d2b42;
      border-radius: 10px;
      padding: 3px 12px;
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 8px;
      box-shadow: 0 3px 0 #2d2b42;
    }
    .dialogue-text {
      font-size: 16px;
      font-weight: 700;
      color: #2d2b42;
      line-height: 1.45;
    }
    .dialogue-hint {
      margin-top: 10px;
      text-align: right;
      font-size: 11px;
      font-weight: 800;
      color: #718096;
      text-transform: uppercase;
    }

    /* Interaction Prompts */
    #interact-prompt {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -70px);
      background: #ffffff;
      border: 3px solid #2d2b42;
      border-radius: 12px;
      padding: 6px 14px;
      box-shadow: 0 4px 0 #2d2b42;
      font-size: 13px;
      font-weight: 900;
      color: #2d2b42;
      display: none;
      pointer-events: none;
      z-index: 50;
    }

    /* Controls Help Badge */
    .controls-hint {
      background: rgba(45, 43, 66, 0.85);
      color: white;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      align-self: flex-start;
      margin-top: 12px;
      pointer-events: auto;
    }
    .controls-hint kbd {
      background: #ffffff;
      color: #2d2b42;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 900;
      box-shadow: 0 2px 0 #a0aec0;
    }

    /* Mobile Virtual Controls */
    #mobile-controls {
      display: none;
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    @media (hover: none) and (pointer: coarse) {
      #mobile-controls { display: block; }
      .controls-hint { display: none; }
    }
    .joystick-zone {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.4);
      border: 3px solid #2d2b42;
      border-radius: 50%;
      pointer-events: auto;
    }
    .joystick-nub {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      background: #2d2b42;
      border-radius: 50%;
    }
    .mobile-btn {
      position: absolute;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: 3.5px solid #2d2b42;
      font-weight: 900;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      box-shadow: 0 4px 0 #2d2b42;
    }
    .mobile-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #2d2b42;
    }
    #btn-jump {
      bottom: 40px;
      right: 30px;
      background: #48bb78;
      color: white;
    }
    #btn-action {
      bottom: 40px;
      right: 110px;
      background: #f6ad55;
      color: #2d2b42;
    }

    /* Sound Mute Toggle */
    #sound-toggle {
      background: white;
      border: 3px solid #2d2b42;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 0 #2d2b42;
      pointer-events: auto;
    }
    #sound-toggle:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #2d2b42;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;900&display=swap" rel="stylesheet">
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- Stylized Game UI Overlay -->
  <div id="ui-layer">
    <div class="top-hud">
      <div class="hud-card">
        <div class="hero-avatar">🎒</div>
        <div class="hero-info">
          <h2>Finn the Explorer</h2>
          <div class="hp-bar"><div class="hp-fill"></div></div>
        </div>
      </div>

      <div style="display: flex; gap: 12px; align-items: center;">
        <button id="sound-toggle" title="Toggle Sound">🔊</button>
        <div class="quest-card">
          <h3>Cosmic Crystals</h3>
          <div class="quest-tracker" id="crystal-count">💎 0 / 3 Found</div>
        </div>
      </div>
    </div>

    <div class="controls-hint">
      🎮 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> or <kbd>Arrows</kbd> to Run • <kbd>Space</kbd> Jump • <kbd>E</kbd> Talk • <kbd>Left Click</kbd> Sword Slash
    </div>

    <!-- Interaction Prompt -->
    <div id="interact-prompt">[E] Talk to BMO</div>

    <!-- Retro Dialogue Window -->
    <div id="dialogue-box">
      <div class="speaker-name" id="dialogue-speaker">BMO</div>
      <div class="dialogue-text" id="dialogue-content">Greetings, adventurer! Welcome to the Land of Ooo!</div>
      <div class="dialogue-hint">Press [E] or Space to continue ▾</div>
    </div>

    <!-- Mobile Virtual Gamepad -->
    <div id="mobile-controls">
      <div class="joystick-zone" id="joystick-zone">
        <div class="joystick-nub" id="joystick-nub"></div>
      </div>
      <div class="mobile-btn" id="btn-jump">JUMP</div>
      <div class="mobile-btn" id="btn-action">SWORD</div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. CHIPTUNE SYNTHESIZER (ZERO-ASSET PROCEDURAL AUDIO)
    // =========================================================================
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    document.getElementById('sound-toggle').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-toggle').innerText = soundEnabled ? '🔊' : '🔇';
      if (soundEnabled) playSound('talk');
    });

    function playSound(type) {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'jump') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(440, now + 0.15);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.18);
      } else if (type === 'crystal') {
        // Sparkling arpeggio
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
        osc.frequency.setValueAtTime(1046.50, now + 0.24); // C6
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.45);
        osc.start(now);
        osc.stop(now + 0.45);
      } else if (type === 'slash') {
        // Swoosh noise
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.14);
        osc.start(now);
        osc.stop(now + 0.14);
      } else if (type === 'talk') {
        osc.type = 'square';
        const freqs = [350, 420, 490, 560];
        osc.frequency.setValueAtTime(freqs[Math.floor(Math.random() * freqs.length)], now);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      }
    }

    // =========================================================================
    // 2. THREE.JS SCENE SETUP
    // =========================================================================
    const canvas = document.getElementById('game-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x73c8f8); // Ooo Sky Blue
    scene.fog = new THREE.FogExp2(0x73c8f8, 0.012);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);

    // Dynamic Cartoon Lighting
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x44bb66, 0.65);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 0.85);
    sunLight.position.set(40, 60, 30);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 160;
    const shadowD = 45;
    sunLight.shadow.camera.left = -shadowD;
    sunLight.shadow.camera.right = shadowD;
    sunLight.shadow.camera.top = shadowD;
    sunLight.shadow.camera.bottom = -shadowD;
    scene.add(sunLight);

    // Warm Ambient Light
    const ambientLight = new THREE.AmbientLight(0xfff5e6, 0.25);
    scene.add(ambientLight);

    // =========================================================================
    // 3. THE LAND OF OOO ENVIRONMENT (Rolling Hills, Tree Fort, Candies)
    // =========================================================================
    
    // Main Candy-Grass Rolling Island
    const terrainGeo = new THREE.PlaneGeometry(160, 160, 48, 48);
    terrainGeo.rotateX(-Math.PI / 2);
    const pos = terrainGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const vx = pos.getX(i);
      const vz = pos.getZ(i);
      // Gentle compound hills
      let vy = Math.sin(vx * 0.06) * Math.cos(vz * 0.06) * 3.5;
      vy += Math.sin(vx * 0.12 + vz * 0.08) * 1.5;
      // Tree Fort central hill
      const distToCenter = Math.hypot(vx, vz);
      if (distToCenter < 35) {
        vy += Math.cos((distToCenter / 35) * (Math.PI / 2)) * 5;
      }
      pos.setY(i, vy);
    }
    terrainGeo.computeVertexNormals();

    const terrainMat = new THREE.MeshToonMaterial({
      color: 0x58c35a, // Candy-Apple Green
      roughness: 0.8,
    });
    const terrain = new THREE.Mesh(terrainGeo, terrainMat);
    terrain.receiveShadow = true;
    scene.add(terrain);

    // Height sampler for smooth physics grounding
    function getTerrainHeight(x, z) {
      let vy = Math.sin(x * 0.06) * Math.cos(z * 0.06) * 3.5;
      vy += Math.sin(x * 0.12 + z * 0.08) * 1.5;
      const dist = Math.hypot(x, z);
      if (dist < 35) {
        vy += Math.cos((dist / 35) * (Math.PI / 2)) * 5;
      }
      return vy;
    }

    // Procedural Whimsical Trees
    function createTree(x, z, canopyColor, scale = 1) {
      const tree = new THREE.Group();
      const y = getTerrainHeight(x, z);
      tree.position.set(x, y, z);
      tree.scale.set(scale, scale, scale);

      // Curved Trunk
      const trunkMat = new THREE.MeshToonMaterial({ color: 0x8b5a2b });
      const trunkGeo = new THREE.CylinderGeometry(0.35, 0.6, 3.5, 8);
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = 1.75;
      trunk.rotation.z = (Math.random() - 0.5) * 0.15;
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      tree.add(trunk);

      // Fluffy Geometric Canopy
      const canopyMat = new THREE.MeshToonMaterial({ color: canopyColor });
      const mainCanopy = new THREE.Mesh(new THREE.DodecahedronGeometry(2.1, 1), canopyMat);
      mainCanopy.position.y = 4.2;
      mainCanopy.castShadow = true;
      tree.add(mainCanopy);

      const subCanopy = new THREE.Mesh(new THREE.DodecahedronGeometry(1.5, 1), canopyMat);
      subCanopy.position.set(0.8, 5.2, 0.4);
      subCanopy.castShadow = true;
      tree.add(subCanopy);

      scene.add(tree);
    }

    // Generate Enchanted Forest with Ooo Candy Colors
    const treeColors = [0xff6b8b, 0x48dbfb, 0xfeca57, 0x1dd1a1, 0xa29bfe, 0xff9ff3];
    for (let i = 0; i < 45; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 18 + Math.random() * 55;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      const color = treeColors[i % treeColors.length];
      createTree(x, z, color, 0.8 + Math.random() * 0.6);
    }

    // Cozy Giant Treehouse on Central Hill
    const treehouse = new THREE.Group();
    const thHeight = getTerrainHeight(0, 0);
    treehouse.position.set(0, thHeight, 0);

    // Massive Trunk
    const bigTrunk = new THREE.Mesh(
      new THREE.CylinderGeometry(3.5, 5, 14, 12),
      new THREE.MeshToonMaterial({ color: 0x5a341a })
    );
    bigTrunk.position.y = 7;
    bigTrunk.castShadow = true;
    bigTrunk.receiveShadow = true;
    treehouse.add(bigTrunk);

    // Wooden Fort Hut
    const hutMat = new THREE.MeshToonMaterial({ color: 0xdfad6b });
    const hut = new THREE.Mesh(new THREE.BoxGeometry(6, 4.5, 6), hutMat);
    hut.position.set(0, 13.5, 0);
    hut.castShadow = true;
    treehouse.add(hut);

    // Red Fort Roof
    const roof = new THREE.Mesh(
      new THREE.ConeGeometry(5.5, 3.5, 4),
      new THREE.MeshToonMaterial({ color: 0xee5253 })
    );
    roof.position.set(0, 17.5, 0);
    roof.rotation.y = Math.PI / 4;
    roof.castShadow = true;
    treehouse.add(roof);

    // Lookout Balcony
    const balcony = new THREE.Mesh(
      new THREE.BoxGeometry(7, 0.4, 7),
      new THREE.MeshToonMaterial({ color: 0x8b5a2b })
    );
    balcony.position.set(0, 11.2, 0);
    balcony.castShadow = true;
    treehouse.add(balcony);

    // Giant Tree Foliage Over Fort
    const fortFoliage = new THREE.Mesh(
      new THREE.DodecahedronGeometry(7.5, 1),
      new THREE.MeshToonMaterial({ color: 0x2ed573 })
    );
    fortFoliage.position.set(0, 21, 0);
    fortFoliage.castShadow = true;
    treehouse.add(fortFoliage);

    scene.add(treehouse);

    // Fluffy Floating Clouds in Sky
    const clouds = [];
    for (let i = 0; i < 16; i++) {
      const cloud = new THREE.Group();
      const numPuffs = 4 + Math.floor(Math.random() * 3);
      const puffMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.92 });
      for (let j = 0; j < numPuffs; j++) {
        const puff = new THREE.Mesh(new THREE.SphereGeometry(2.5 + Math.random() * 2, 8, 8), puffMat);
        puff.position.set((j - numPuffs / 2) * 2.8, (Math.random() - 0.5) * 1.2, (Math.random() - 0.5) * 2);
        cloud.add(puff);
      }
      cloud.position.set((Math.random() - 0.5) * 160, 28 + Math.random() * 15, (Math.random() - 0.5) * 160);
      cloud.userData = { speed: 0.03 + Math.random() * 0.04 };
      scene.add(cloud);
      clouds.push(cloud);
    }

    // =========================================================================
    // 4. CHARACTERS: FINN (PLAYER) & OOO COMPANIONS (BMO, JAKE, PRINCESS)
    // =========================================================================

    // Factory: Create Tiny Animated Adventure Character
    function createAdventureCharacter(options = {}) {
      const char = new THREE.Group();

      const {
        shirtColor = 0x3498db, // Finn Sky Blue
        pantsColor = 0x2980b9, // Deep Blue Shorts
        hatType = 'finn',      // 'finn', 'bmo', 'princess', 'dog'
        backpackColor = 0x27ae60, // Green backpack
        skinColor = 0xf8d3b4,
        scale = 1
      } = options;

      char.scale.set(scale, scale, scale);

      // Ground Shadow Ring
      const shadowGeo = new THREE.RingGeometry(0.01, 0.7, 16);
      shadowGeo.rotateX(-Math.PI / 2);
      const shadowMat = new THREE.MeshBasicMaterial({ color: 0x1b4332, transparent: true, opacity: 0.25 });
      const shadow = new THREE.Mesh(shadowGeo, shadowMat);
      shadow.position.y = 0.04;
      char.add(shadow);

      // Root Actor
      const bodyRoot = new THREE.Group();
      char.add(bodyRoot);

      // Torso / Tunic
      const torsoGeo = new THREE.CylinderGeometry(0.42, 0.45, 0.9, 10);
      const torsoMat = new THREE.MeshToonMaterial({ color: shirtColor });
      const torso = new THREE.Mesh(torsoGeo, torsoMat);
      torso.position.y = 1.1;
      torso.castShadow = true;
      bodyRoot.add(torso);

      // Little Backpack
      const backpackGeo = new THREE.BoxGeometry(0.5, 0.65, 0.35);
      const backpackMat = new THREE.MeshToonMaterial({ color: backpackColor });
      const backpack = new THREE.Mesh(backpackGeo, backpackMat);
      backpack.position.set(0, 1.15, -0.36);
      backpack.castShadow = true;
      bodyRoot.add(backpack);

      // Head
      const headGeo = new THREE.SphereGeometry(0.44, 16, 16);
      const headMat = new THREE.MeshToonMaterial({ color: skinColor });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 1.85;
      head.castShadow = true;
      bodyRoot.add(head);

      // Eyes (Adventure Time dot eyes)
      const eyeGeo = new THREE.SphereGeometry(0.06, 8, 8);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.16, 1.88, 0.4);
      bodyRoot.add(leftEye);

      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(0.16, 1.88, 0.4);
      bodyRoot.add(rightEye);

      // Finn's Iconic White Hat with Bear Ears
      if (hatType === 'finn') {
        const hatMat = new THREE.MeshToonMaterial({ color: 0xffffff });
        const hatHood = new THREE.Mesh(new THREE.SphereGeometry(0.47, 16, 16), hatMat);
        hatHood.position.set(0, 1.9, -0.04);
        hatHood.scale.set(1.02, 1.05, 1.02);
        bodyRoot.add(hatHood);

        // Bear Ears
        const earGeo = new THREE.SphereGeometry(0.14, 8, 8);
        const leftEar = new THREE.Mesh(earGeo, hatMat);
        leftEar.position.set(-0.35, 2.38, -0.05);
        bodyRoot.add(leftEar);

        const rightEar = new THREE.Mesh(earGeo, hatMat);
        rightEar.position.set(0.35, 2.38, -0.05);
        bodyRoot.add(rightEar);
      } else if (hatType === 'princess') {
        // Princess Bubblegum Crown
        const crownMat = new THREE.MeshToonMaterial({ color: 0xf1c40f });
        const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.25, 0.4, 5), crownMat);
        crown.position.set(0, 2.38, 0);
        bodyRoot.add(crown);
      }

      // Legs
      const legGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.65, 8);
      const legMat = new THREE.MeshToonMaterial({ color: pantsColor });

      const leftLeg = new THREE.Mesh(legGeo, legMat);
      leftLeg.position.set(-0.2, 0.4, 0);
      leftLeg.castShadow = true;
      bodyRoot.add(leftLeg);

      const rightLeg = new THREE.Mesh(legGeo, legMat);
      rightLeg.position.set(0.2, 0.4, 0);
      rightLeg.castShadow = true;
      bodyRoot.add(rightLeg);

      // Arms
      const armGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.6, 8);
      const armMat = new THREE.MeshToonMaterial({ color: skinColor });

      const leftArm = new THREE.Mesh(armGeo, armMat);
      leftArm.position.set(-0.55, 1.1, 0);
      leftArm.castShadow = true;
      bodyRoot.add(leftArm);

      const rightArm = new THREE.Mesh(armGeo, armMat);
      rightArm.position.set(0.55, 1.1, 0);
      rightArm.castShadow = true;
      bodyRoot.add(rightArm);

      // Scarlet / Golden Sword (Held by player)
      const swordGroup = new THREE.Group();
      if (hatType === 'finn') {
        const bladeGeo = new THREE.BoxGeometry(0.1, 0.9, 0.05);
        const bladeMat = new THREE.MeshToonMaterial({ color: 0xf1c40f, emissive: 0xd4ac0d, emissiveIntensity: 0.2 });
        const blade = new THREE.Mesh(bladeGeo, bladeMat);
        blade.position.y = 0.55;
        blade.castShadow = true;
        swordGroup.add(blade);

        const hilt = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.08, 0.08), new THREE.MeshToonMaterial({ color: 0xe74c3c }));
        hilt.position.y = 0.12;
        swordGroup.add(hilt);

        swordGroup.position.set(0, -0.28, 0.2);
        swordGroup.rotation.x = Math.PI / 3;
        rightArm.add(swordGroup);
      }

      return {
        group: char,
        bodyRoot,
        leftLeg,
        rightLeg,
        leftArm,
        rightArm,
        swordGroup,
        walkCycle: 0,
        isMoving: false,
        isSlashing: false,
        slashProgress: 0
      };
    }

    // 1. Create Finn (The Player)
    const player = createAdventureCharacter({
      shirtColor: 0x3498db,
      pantsColor: 0x2980b9,
      hatType: 'finn',
      backpackColor: 0x27ae60,
    });
    player.group.position.set(0, getTerrainHeight(0, 14), 14);
    scene.add(player.group);

    // Player Physics State
    const playerState = {
      x: 0,
      y: getTerrainHeight(0, 14),
      z: 14,
      vx: 0,
      vz: 0,
      vy: 0,
      speed: 0.24,
      rotation: 0,
      isGrounded: true,
      crystalsFound: 0
    };

    // 2. Create BMO Companion NPC
    const bmoGroup = new THREE.Group();
    const bmoBody = new THREE.Mesh(
      new THREE.BoxGeometry(1.0, 1.3, 0.7),
      new THREE.MeshToonMaterial({ color: 0x48dbfb }) // Teal Green
    );
    bmoBody.position.y = 0.85;
    bmoBody.castShadow = true;
    bmoGroup.add(bmoBody);

    // BMO Screen
    const bmoScreen = new THREE.Mesh(
      new THREE.PlaneGeometry(0.7, 0.55),
      new THREE.MeshBasicMaterial({ color: 0x1dd1a1 })
    );
    bmoScreen.position.set(0, 1.05, 0.36);
    bmoGroup.add(bmoScreen);

    // BMO Face (^_^)
    const bmoX = -6;
    const bmoZ = 12;
    bmoGroup.position.set(bmoX, getTerrainHeight(bmoX, bmoZ), bmoZ);
    scene.add(bmoGroup);

    // 3. Create Princess Bubblegum NPC
    const pb = createAdventureCharacter({
      shirtColor: 0xff6b8b, // Candy Pink
      pantsColor: 0xff6b8b,
      hatType: 'princess',
      skinColor: 0xffd1dc,
      scale: 1.05
    });
    const pbX = 8;
    const pbZ = 6;
    pb.group.position.set(pbX, getTerrainHeight(pbX, pbZ), pbZ);
    scene.add(pb.group);

    // 4. Create Jake the Dog
    const jakeGroup = new THREE.Group();
    const jakeBody = new THREE.Mesh(
      new THREE.CylinderGeometry(0.55, 0.55, 1.2, 12),
      new THREE.MeshToonMaterial({ color: 0xfeca57 }) // Gold Yellow
    );
    jakeBody.position.y = 0.6;
    jakeBody.castShadow = true;
    jakeGroup.add(jakeBody);

    // Jake Big White Muzzle Eyes
    const jakeEye = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 12, 12),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    jakeEye.position.set(-0.2, 0.85, 0.5);
    jakeGroup.add(jakeEye);
    const jakePupil = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), new THREE.MeshBasicMaterial({ color: 0x111111 }));
    jakePupil.position.set(-0.2, 0.85, 0.68);
    jakeGroup.add(jakePupil);

    const jakeEyeR = jakeEye.clone();
    jakeEyeR.position.x = 0.2;
    jakeGroup.add(jakeEyeR);
    const jakePupilR = jakePupil.clone();
    jakePupilR.position.x = 0.2;
    jakeGroup.add(jakePupilR);

    const jakeX = 3.5;
    const jakeZ = 13;
    jakeGroup.position.set(jakeX, getTerrainHeight(jakeX, jakeZ), jakeZ);
    scene.add(jakeGroup);

    // =========================================================================
    // 5. COLLECTIBLE COSMIC CRYSTALS
    // =========================================================================
    const crystals = [
      { x: -18, z: -15, collected: false, mesh: null },
      { x: 22, z: -20, collected: false, mesh: null },
      { x: -2, z: -35, collected: false, mesh: null },
    ];

    const crystalGeo = new THREE.OctahedronGeometry(0.7, 0);
    const crystalMat = new THREE.MeshToonMaterial({
      color: 0x00f2fe,
      emissive: 0x4facfe,
      emissiveIntensity: 0.6,
      roughness: 0.2
    });

    crystals.forEach((c) => {
      const mesh = new THREE.Mesh(crystalGeo, crystalMat);
      const cy = getTerrainHeight(c.x, c.z) + 1.2;
      mesh.position.set(c.x, cy, c.z);
      mesh.castShadow = true;
      scene.add(mesh);
      c.mesh = mesh;
    });

    // =========================================================================
    // 6. NPC DIALOGUE SYSTEM
    // =========================================================================
    const npcs = [
      {
        name: 'BMO',
        x: bmoX,
        z: bmoZ,
        radius: 3.5,
        lines: [
          "Yay, Finn! BMO is so happy to see you!",
          "Did you know there are 3 Cosmic Crystals hidden across Ooo?",
          "Be careful not to step on the candy flowers!"
        ],
        lineIndex: 0
      },
      {
        name: 'Princess Bubblegum',
        x: pbX,
        z: pbZ,
        radius: 3.5,
        lines: [
          "Greetings, Finn! My scientific candy radar detected strange crystal energy nearby.",
          "If you collect all 3 Cosmic Crystals, the Tree Fort portal will awaken!",
          "Hurry, before the Ice King catches wind of this!"
        ],
        lineIndex: 0
      },
      {
        name: 'Jake the Dog',
        x: jakeX,
        z: jakeZ,
        radius: 3.5,
        lines: [
          "Yo Finn! I was just dreaming about an everything burrito...",
          "Use your sword with Left Click if you see any suspicious bushes, bro!",
          "Let's go on an adventure! Mathematical!"
        ],
        lineIndex: 0
      }
    ];

    let activeDialogue = null;
    const dialogueBox = document.getElementById('dialogue-box');
    const dialogueSpeaker = document.getElementById('dialogue-speaker');
    const dialogueContent = document.getElementById('dialogue-content');
    const interactPrompt = document.getElementById('interact-prompt');

    function showDialogue(npc) {
      activeDialogue = npc;
      dialogueSpeaker.innerText = npc.name;
      dialogueContent.innerText = npc.lines[npc.lineIndex % npc.lines.length];
      dialogueBox.style.display = 'block';
      interactPrompt.style.display = 'none';
      playSound('talk');
      npc.lineIndex++;
    }

    function closeDialogue() {
      activeDialogue = null;
      dialogueBox.style.display = 'none';
    }

    // =========================================================================
    // 7. INPUT HANDLING (KEYBOARD + TOUCH + MOUSE)
    // =========================================================================
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;

      if (e.code === 'KeyE' || e.code === 'Space') {
        if (activeDialogue) {
          e.preventDefault();
          if (activeDialogue.lineIndex < activeDialogue.lines.length) {
            showDialogue(activeDialogue);
          } else {
            closeDialogue();
          }
          return;
        }
      }

      if (e.code === 'KeyE') {
        // Check near NPC
        for (const npc of npcs) {
          const dist = Math.hypot(playerState.x - npc.x, playerState.z - npc.z);
          if (dist < npc.radius) {
            showDialogue(npc);
            break;
          }
        }
      }

      if (e.code === 'Space' && playerState.isGrounded && !activeDialogue) {
        playerState.vy = 0.38;
        playerState.isGrounded = false;
        playSound('jump');
      }

      if (e.code === 'KeyF' && !player.isSlashing) {
        triggerSwordSlash();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // Left Click Sword Slash
    window.addEventListener('mousedown', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.closest('#dialogue-box')) return;
      if (!player.isSlashing) triggerSwordSlash();
    });

    function triggerSwordSlash() {
      player.isSlashing = true;
      player.slashProgress = 0;
      playSound('slash');
    }

    // Mobile Virtual Joystick
    let touchJoystick = { active: false, startX: 0, startY: 0, moveX: 0, moveY: 0 };
    const joystickZone = document.getElementById('joystick-zone');
    const joystickNub = document.getElementById('joystick-nub');

    joystickZone.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const rect = joystickZone.getBoundingClientRect();
      touchJoystick.active = true;
      touchJoystick.startX = rect.left + rect.width / 2;
      touchJoystick.startY = rect.top + rect.height / 2;
    });

    window.addEventListener('touchmove', (e) => {
      if (!touchJoystick.active) return;
      const touch = e.touches[0];
      const dx = touch.clientX - touchJoystick.startX;
      const dy = touch.clientY - touchJoystick.startY;
      const dist = Math.hypot(dx, dy);
      const maxDist = 45;
      const angle = Math.atan2(dy, dx);
      const clampedDist = Math.min(dist, maxDist);

      const nx = Math.cos(angle) * clampedDist;
      const ny = Math.sin(angle) * clampedDist;

      joystickNub.style.transform = `translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;
      touchJoystick.moveX = nx / maxDist;
      touchJoystick.moveY = ny / maxDist;
    });

    window.addEventListener('touchend', () => {
      touchJoystick.active = false;
      touchJoystick.moveX = 0;
      touchJoystick.moveY = 0;
      joystickNub.style.transform = 'translate(-50%, -50%)';
    });

    document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (playerState.isGrounded) {
        playerState.vy = 0.38;
        playerState.isGrounded = false;
        playSound('jump');
      }
    });

    document.getElementById('btn-action').addEventListener('touchstart', (e) => {
      e.preventDefault();
      triggerSwordSlash();
    });

    // =========================================================================
    // 8. GAME LOOP & ANIMATION
    // =========================================================================
    let time = 0;

    function animate() {
      requestAnimationFrame(animate);
      time += 0.02;

      // 1. Move Clouds
      clouds.forEach((c) => {
        c.position.x += c.userData.speed;
        if (c.position.x > 80) c.position.x = -80;
      });

      // 2. Rotate Collectible Crystals
      crystals.forEach((c) => {
        if (!c.collected && c.mesh) {
          c.mesh.rotation.y += 0.03;
          c.mesh.position.y = getTerrainHeight(c.x, c.z) + 1.2 + Math.sin(time * 3 + c.x) * 0.25;

          // Check Player Collision
          const dist = Math.hypot(playerState.x - c.x, playerState.z - c.z);
          if (dist < 1.6) {
            c.collected = true;
            scene.remove(c.mesh);
            playerState.crystalsFound++;
            playSound('crystal');
            document.getElementById('crystal-count').innerText = `💎 ${playerState.crystalsFound} / 3 Found`;
            if (playerState.crystalsFound === 3) {
              setTimeout(() => {
                showDialogue({
                  name: 'Princess Bubblegum',
                  lines: ['MATHEMATICAL! You found all 3 Cosmic Crystals! Ooo is saved! 🎉'],
                  lineIndex: 0
                });
              }, 400);
            }
          }
        }
      });

      // 3. Player Movement Physics
      let inputX = 0;
      let inputZ = 0;

      if (keys['KeyW'] || keys['ArrowUp']) inputZ -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) inputZ += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) inputX -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) inputX += 1;

      if (touchJoystick.active) {
        inputX = touchJoystick.moveX;
        inputZ = touchJoystick.moveY;
      }

      const inputLen = Math.hypot(inputX, inputZ);
      const isMoving = inputLen > 0.1 && !activeDialogue;

      if (isMoving) {
        const normX = inputX / (inputLen || 1);
        const normZ = inputZ / (inputLen || 1);

        playerState.vx = normX * playerState.speed;
        playerState.vz = normZ * playerState.speed;

        // Smooth Rotation Facing
        const targetAngle = Math.atan2(normX, normZ);
        let diff = targetAngle - playerState.rotation;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        playerState.rotation += diff * 0.2;
      } else {
        playerState.vx *= 0.7;
        playerState.vz *= 0.7;
      }

      playerState.x += playerState.vx;
      playerState.z += playerState.vz;

      // Gravity & Grounding
      playerState.vy -= 0.018; // Gravity
      playerState.y += playerState.vy;
      const groundY = getTerrainHeight(playerState.x, playerState.z);

      if (playerState.y <= groundY) {
        playerState.y = groundY;
        playerState.vy = 0;
        playerState.isGrounded = true;
      }

      player.group.position.set(playerState.x, playerState.y, playerState.z);
      player.group.rotation.y = playerState.rotation;

      // 4. Procedural Character Run / Walk Animation
      if (isMoving && playerState.isGrounded) {
        player.walkCycle += 0.28;
        const swing = Math.sin(player.walkCycle) * 0.65;
        player.leftLeg.rotation.x = swing;
        player.rightLeg.rotation.x = -swing;
        player.leftArm.rotation.x = -swing;
        if (!player.isSlashing) {
          player.rightArm.rotation.x = swing;
        }
        player.bodyRoot.position.y = Math.abs(Math.sin(player.walkCycle * 2)) * 0.12;
      } else if (!playerState.isGrounded) {
        // In-air jump pose
        player.leftLeg.rotation.x = 0.4;
        player.rightLeg.rotation.x = -0.3;
        player.leftArm.rotation.x = -0.8;
      } else {
        // Idle breathing
        player.leftLeg.rotation.x *= 0.8;
        player.rightLeg.rotation.x *= 0.8;
        player.leftArm.rotation.x *= 0.8;
        if (!player.isSlashing) player.rightArm.rotation.x *= 0.8;
        player.bodyRoot.position.y = Math.sin(time * 2.5) * 0.04;
      }

      // Sword Slash Animation
      if (player.isSlashing) {
        player.slashProgress += 0.14;
        const slashRot = Math.sin(player.slashProgress * Math.PI) * 1.8;
        player.rightArm.rotation.x = -slashRot;
        player.rightArm.rotation.z = Math.sin(player.slashProgress * Math.PI) * 0.5;
        if (player.slashProgress >= 1) {
          player.isSlashing = false;
          player.rightArm.rotation.z = 0;
        }
      }

      // 5. NPC Proximity Check
      let nearNpc = null;
      for (const npc of npcs) {
        const dist = Math.hypot(playerState.x - npc.x, playerState.z - npc.z);
        if (dist < npc.radius) {
          nearNpc = npc;
          break;
        }
      }

      if (nearNpc && !activeDialogue) {
        interactPrompt.innerText = `[E] Talk to ${nearNpc.name}`;
        interactPrompt.style.display = 'block';
      } else if (!activeDialogue) {
        interactPrompt.style.display = 'none';
      }

      // 6. Smooth Third-Person Camera Follow
      const camDist = 13.5;
      const camHeight = 7.5;
      const targetCamX = playerState.x - Math.sin(playerState.rotation) * camDist * 0.35;
      const targetCamZ = playerState.z + camDist;
      const targetCamY = playerState.y + camHeight;

      camera.position.x += (targetCamX - camera.position.x) * 0.08;
      camera.position.y += (targetCamY - camera.position.y) * 0.08;
      camera.position.z += (targetCamZ - camera.position.z) * 0.08;

      camera.lookAt(playerState.x, playerState.y + 1.6, playerState.z);

      renderer.render(scene, camera);
    }

    animate();

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
